<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Planche de contrôle des fruits</title>
    <style>
      body {
        margin: 0;
        background: #14425c;
        font-family: 'Trebuchet MS', sans-serif;
        color: #fff;
      }
      #sheet { display: block; }
    </style>
  </head>
  <body>
    <canvas id="sheet"></canvas>
    <script type="module">
      import { FRUIT_VARIETIES, BONUS_VARIETY, FRENZY_VARIETY } from '/src/utils/fruitCatalog.ts';
      import { paintWhole, paintCut } from '/src/utils/fruitArt.ts';

      const params = new URLSearchParams(location.search);
      const only = params.get('only');
      const zoom = Math.max(1, Math.min(4, Number(params.get('zoom')) || 1));
      const SUPERSAMPLE = 3;

      // Reproduit exactement ce que fait PreloadScene.createVarietyTextures,
      // suréchantillonnage compris. Sans cette fidélité, la planche montrerait
      // un rendu qui n'existe nulle part dans le jeu — et servirait donc à
      // juger autre chose que ce que voit le joueur.
      //
      // ?zoom=N agrandit le TRACÉ, il n'étire pas une image : on veut juger la
      // netteté réelle du dessin, pas des pixels agrandis.
      function renderVariant(variety, variant) {
        const size = (variety.radius * 2 + 64) * zoom;
        const echelle = SUPERSAMPLE * zoom;

        const grand = document.createElement('canvas');
        grand.width = size * SUPERSAMPLE;
        grand.height = size * SUPERSAMPLE;
        const ctx = grand.getContext('2d');
        ctx.scale(echelle, echelle);

        const logique = size / zoom;
        ctx.save();
        if (variant === 'left') {
          ctx.beginPath();
          ctx.rect(0, 0, logique / 2, logique);
          ctx.clip();
        } else if (variant === 'right') {
          ctx.beginPath();
          ctx.rect(logique / 2, 0, logique / 2, logique);
          ctx.clip();
        }
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 13;
        paintWhole(ctx, variety, logique);
        if (variant !== 'whole') {
          paintCut(ctx, variety, logique, variant);
        }
        ctx.restore();

        const cv = document.createElement('canvas');
        cv.width = size;
        cv.height = size;
        const petit = cv.getContext('2d');
        petit.imageSmoothingEnabled = true;
        petit.imageSmoothingQuality = 'high';
        petit.drawImage(grand, 0, 0, size, size);
        return cv;
      }

      // ?only=<clé> n'affiche qu'une variété, en haut de page : sur une planche
      // de dix fruits il fallait faire défiler pour juger le dernier.
      let all = [...FRUIT_VARIETIES, BONUS_VARIETY, FRENZY_VARIETY];
      if (only) {
        const filtre = all.filter((v) => v.key === only);
        if (filtre.length > 0) {
          all = filtre;
        } else {
          document.title = 'CLE INCONNUE';
        }
      }
      const CELL = 210 * zoom;
      const ROW = CELL + 46;
      const sheet = document.getElementById('sheet');
      sheet.width = CELL * 3 + 40;
      sheet.height = ROW * all.length + 20;
      const ctx = sheet.getContext('2d');

      // Fond assombri comme en partie, pour juger le contraste réel
      ctx.fillStyle = '#123c52';
      ctx.fillRect(0, 0, sheet.width, sheet.height);

      all.forEach((variety, row) => {
        const y = 20 + row * ROW;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px "Trebuchet MS", sans-serif';
        ctx.fillText(variety.displayName, 20, y + 8);
        ['whole', 'left', 'right'].forEach((variant, col) => {
          const cv = renderVariant(variety, variant);
          const x = 20 + col * CELL + (CELL - cv.width) / 2;
          ctx.drawImage(cv, x, y + 18);
        });
      });
      document.title = 'PRET';
    </script>
  </body>
</html>
