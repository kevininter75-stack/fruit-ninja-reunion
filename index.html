<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Kout Sab' — un coup de sabre dans les fruits péi !" />
    <meta name="theme-color" content="#0b454b" />
    <!-- PWA : installable depuis le navigateur mobile.
         Chemins relatifs pour supporter un hébergement en sous-chemin (GitHub Pages). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/lagon-192.png" />
    <!-- iOS : icône et mode plein écran une fois épinglé -->
    <link rel="apple-touch-icon" href="icons/lagon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kout Sab'" />
    <title>Kout Sab'</title>
    <link rel="preload" as="image" href="assets/decors/lagon-v1.webp" />
    <style>
      /* Police d'affichage du jeu (SIL OFL, embarquée — cf. public/fonts/OFL.txt).
         Chemin relatif pour l'hébergement en sous-chemin (GitHub Pages).
         `font-display: block` : on préfère un bref texte invisible à un rendu
         dans la police système qui basculerait ensuite — le jeu attend de
         toute façon son chargement avant de démarrer (cf. main.ts). */
      @font-face {
        font-family: 'Fredoka';
        src: url('fonts/fredoka-latin.woff2') format('woff2');
        font-weight: 300 700;
        font-style: normal;
        font-display: block;
      }
      /* Shrikhand : la voix du jeu — titre, exclamations créoles, bandeaux.
         Elle a des pleins et des déliés là où Fredoka est régulière, ce qui la
         met d'accord avec un décor peint à la main. Les CHIFFRES restent à
         Fredoka : la planche du HUD est fabriquée à partir d'elle, et un
         caractère d'affichage aussi gras rendrait 6, 8 et 9 confus au petit
         corps. Deux polices, chacune à son poste. */
      @font-face {
        font-family: 'Shrikhand';
        src: url('fonts/shrikhand-latin.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      /* Plein écran, pas de scroll, fond sombre pendant le chargement */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b2a3a;
        touch-action: none; /* empêche le scroll/zoom natif pendant les swipes */
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        /* Safe-areas (encoche, barre de geste) : le canvas reste dans la zone sûre */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #startup {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        text-align: center;
        color: #fff3e0;
        background: #103c49 url('assets/decors/lagon-v1.webp') center / cover;
        font-family: 'Fredoka', 'Trebuchet MS', sans-serif;
      }
      #startup::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(4, 31, 43, .38);
      }
      #startup > * { position: relative; }
      .startup-icon { justify-self: center; width: clamp(64px, 16vmin, 104px); height: auto; border-radius: 24%; margin-bottom: 12px; box-shadow: 0 8px 26px #052f4099; }
      #startup h1 {
        margin: 0 0 12px;
        font: 400 clamp(36px, 8vw, 80px) 'Shrikhand', 'Trebuchet MS', sans-serif;
        text-shadow: 0 3px 8px #103c49;
      }
      #startup p {
        margin: 0;
        padding: 6px 16px; justify-self: center;
        background: rgba(7, 59, 73, .9);
        border: 1px solid #9cdae0;
        border-radius: 18px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="startup" role="status" aria-live="polite"><img class="startup-icon" src="icons/lagon-192.png" width="96" height="96" alt=""><h1>Kout Sab'</h1><p>Chargement…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
